# Light Page
lvgl:
  pages:
    - id: light_page
      scrollable: false
      bg_color: 0xFFFFFF
      widgets:
        - obj:
            id: light_content
            styles: content_container
            scrollable: false
            layout:
              type: grid
              grid_rows: [fr(10), fr(30), fr(30), fr(30)]
              grid_columns: [fr(1), fr(1)]
              pad_row: 24
              pad_column: 24
            widgets:
              - obj:
                  id: light_click_area
                  styles: card_sm
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  clickable: true
                  on_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light_entity}
                  widgets:
                    - label:
                        text_font: extra_icon
                        text_color: 0x9E9E9E
                        text: "\U000F18DE"
                        align: LEFT_MID
                        x: 20
                        y: 0
                        id: light_icon_label

                    - label:
                        text_font: font_cjk_28
                        styles: card_sm_main_label
                        id: light_main_label
                        text: ""

                    - switch:
                        id: light_btn
                        width: 90
                        height: 48
                        radius: 24
                        bg_color: 0x606060
                        align: RIGHT_MID
                        x: -20
                        on_value:
                          - if:
                              condition:
                                lambda: 'return x;'
                              then:
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: ${light_entity}
                              else:
                                - homeassistant.action:
                                    action: light.turn_off
                                    data:
                                      entity_id: ${light_entity}
        - label:
            x: 220
            y: 40
            text_font: font_cjk_28
            text: "灯光"
