substitutions:
  name: m5stack-dial-media
  friendly_name: M5Stack Dial
  ui_timeout_ms: "10000"
  swipe_threshold_px: "42"
  rotate_debounce_ms: "25"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - output.turn_on: power_hold
      - bm8563.read_time:
          id: rtc_time
      - script.execute: sync_ui

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:

esp32_improv:
  authorizer: none

improv_serial:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_hotspot_password

captive_portal:

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO5

i2c:
  sda: GPIO11
  scl: GPIO12
  scan: true
  id: internal_i2c

time:
  - platform: bm8563
    id: rtc_time
    update_interval: never

  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - bm8563.write_time:
            id: rtc_time

globals:
  - id: volume_cache
    type: float
    restore_value: yes
    initial_value: "-20.0"
  - id: ui_last_interaction_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: buzzer_frequency
    type: float
    restore_value: yes
    initial_value: "2000.0"
  - id: screen_page
    type: int
    restore_value: no
    initial_value: "0"
  - id: config_row
    type: int
    restore_value: no
    initial_value: "0"
  - id: swipe_handled
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_rotate_event_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: volume_sync_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: zone_display_value
    type: std::string
    restore_value: yes
    initial_value: '"-"'
  - id: profile_display_value
    type: std::string
    restore_value: yes
    initial_value: '"-"'
  - id: source_display_value
    type: std::string
    restore_value: yes
    initial_value: '"-"'
  - id: mute_display_value
    type: std::string
    restore_value: yes
    initial_value: '""'
  - id: power_display_value
    type: std::string
    restore_value: yes
    initial_value: '""'
  - id: volume_display_value
    type: std::string
    restore_value: yes
    initial_value: '"-20.0 dB"'
  - id: volume_step_value
    type: float
    restore_value: yes
    initial_value: "1.0"

output:
  - platform: gpio
    pin: GPIO46
    id: power_hold
  - platform: ledc
    pin: GPIO9
    id: backlight_pwm
  - platform: ledc
    pin: GPIO3
    id: buzzer_output
    frequency: 2000Hz

rtttl:
  output: buzzer_output

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "${friendly_name} Backlight"
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

  - platform: monochromatic
    output: buzzer_output
    id: buzzer_light
    name: "${friendly_name} Buzzer"
    icon: mdi:speaker-wireless
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

number:
  - platform: template
    id: buzzer_tone
    name: "${friendly_name} Buzzer Tone"
    optimistic: true
    restore_value: true
    min_value: 200
    max_value: 5000
    step: 50
    initial_value: 2000
    unit_of_measurement: "Hz"
    mode: slider
    set_action:
      - lambda: |-
          id(buzzer_frequency) = x;
          id(buzzer_output).update_frequency(x);

  - platform: template
    id: volume_step_number
    name: "${friendly_name} Volume Step"
    optimistic: true
    restore_value: true
    min_value: 0.5
    max_value: 6.0
    step: 0.5
    initial_value: 1.0
    unit_of_measurement: "dB"
    mode: slider
    set_action:
      - lambda: |-
          id(volume_step_value) = x;

font:
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 14
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
  - file: "gfonts://Roboto"
    id: font_medium
    size: 24
  - file: "gfonts://Roboto"
    id: font_semilarge
    size: 44
  - file: "gfonts://Roboto"
    id: font_large
    size: 60

event:
  - platform: template
    id: media_controls
    name: "${friendly_name} Media Controls"
    device_class: button
    event_types:
      - button_single
      - button_double
      - button_long
      - volume_apply
      - rotate_left
      - rotate_right
      - zone_prev
      - zone_next
      - profile_prev
      - profile_next
      - source_prev
      - source_next

script:
  - id: show_active_page
    then:
      - if:
          condition:
            lambda: return id(wifi_ip_address).state.empty();
          then:
            - lvgl.page.show: disconnected_page
          else:
            - if:
                condition:
                  lambda: |-
                    return id(ui_last_interaction_ms) != 0
                      && (millis() - id(ui_last_interaction_ms)) < ${ui_timeout_ms};
                then:
                  - if:
                      condition:
                        lambda: return id(screen_page) == 1;
                      then:
                        - lvgl.page.show: config_page
                      else:
                        - lvgl.page.show: volume_page
                else:
                  - lvgl.page.show: standby_page

  - id: sync_ui
    then:
      - script.execute: show_active_page
      - lvgl.arc.update:
          id: volume_arc
          value: !lambda |-
            const float clamped = std::max(-130.0f, std::min(0.0f, id(volume_cache)));
            return int(clamped + 130.0f);
      - lvgl.label.update:
          id: standby_clock_label
          text: !lambda return id(rtc_clock).state;
      - lvgl.label.update:
          id: standby_date_label
          text: !lambda return id(rtc_date).state;
      - lvgl.label.update:
          id: standby_zone_value
          text: !lambda |-
            auto marquee_text = [](const std::string &text, size_t visible_chars, uint32_t period_ms) {
              if (text.empty() || text.size() <= visible_chars) {
                return text;
              }
              const std::string padded = text + "   ";
              const size_t cycle = padded.size();
              const size_t offset = (millis() / period_ms) % cycle;
              std::string window = padded.substr(offset);
              if (window.size() < visible_chars) {
                window += padded.substr(0, visible_chars - window.size());
              }
              return window.substr(0, visible_chars);
            };
            const std::string zone = id(zone_display_value).empty() ? std::string("-") : id(zone_display_value);
            return marquee_text(zone, 12, 500);
      - lvgl.label.update:
          id: standby_profile_value
          text: !lambda |-
            auto marquee_text = [](const std::string &text, size_t visible_chars, uint32_t period_ms) {
              if (text.empty() || text.size() <= visible_chars) {
                return text;
              }
              const std::string padded = text + "   ";
              const size_t cycle = padded.size();
              const size_t offset = (millis() / period_ms) % cycle;
              std::string window = padded.substr(offset);
              if (window.size() < visible_chars) {
                window += padded.substr(0, visible_chars - window.size());
              }
              return window.substr(0, visible_chars);
            };
            const std::string profile = id(profile_display_value).empty() ? std::string("-") : id(profile_display_value);
            return marquee_text(profile, 12, 500);
      - lvgl.label.update:
          id: standby_source_value
          text: !lambda |-
            auto marquee_text = [](const std::string &text, size_t visible_chars, uint32_t period_ms) {
              if (text.empty() || text.size() <= visible_chars) {
                return text;
              }
              const std::string padded = text + "   ";
              const size_t cycle = padded.size();
              const size_t offset = (millis() / period_ms) % cycle;
              std::string window = padded.substr(offset);
              if (window.size() < visible_chars) {
                window += padded.substr(0, visible_chars - window.size());
              }
              return window.substr(0, visible_chars);
            };
            const std::string source = id(source_display_value).empty() ? std::string("-") : id(source_display_value);
            return marquee_text(source, 12, 500);
      - lvgl.label.update:
          id: standby_volume_label
          text: !lambda |-
            std::string volume_text = id(volume_display_value);
            if (volume_text.size() > 3 && volume_text.substr(volume_text.size() - 3) == " dB") {
              volume_text = volume_text.substr(0, volume_text.size() - 3);
            }
            return volume_text;
      - lvgl.label.update:
          id: config_zone_value
          text: !lambda |-
            std::string zone = id(zone_display_value).empty() ? std::string("-") : id(zone_display_value);
            if (zone.size() > 18) zone = zone.substr(0, 18);
            return zone;
      - lvgl.label.update:
          id: config_profile_value
          text: !lambda |-
            std::string profile = id(profile_display_value).empty() ? std::string("-") : id(profile_display_value);
            if (profile.size() > 18) profile = profile.substr(0, 18);
            return profile;
      - lvgl.label.update:
          id: config_source_value
          text: !lambda |-
            std::string source = id(source_display_value).empty() ? std::string("-") : id(source_display_value);
            if (source.size() > 18) source = source.substr(0, 18);
            return source;
      - lvgl.widget.update:
          id: config_zone_button
          state:
            checked: !lambda return id(config_row) == 0;
      - lvgl.widget.update:
          id: config_profile_button
          state:
            checked: !lambda return id(config_row) == 1;
      - lvgl.widget.update:
          id: config_source_button
          state:
            checked: !lambda return id(config_row) == 2;
      - lvgl.label.update:
          id: volume_value_label
          text: !lambda |-
            std::string volume_text = id(volume_display_value);
            if (volume_text.size() > 3 && volume_text.substr(volume_text.size() - 3) == " dB") {
              volume_text = volume_text.substr(0, volume_text.size() - 3);
            }
            return volume_text;
      - lvgl.label.update:
          id: volume_zone_label
          text: !lambda |-
            auto marquee_text = [](const std::string &text, size_t visible_chars, uint32_t period_ms) {
              if (text.empty() || text.size() <= visible_chars) {
                return text;
              }
              const std::string padded = text + "   ";
              const size_t cycle = padded.size();
              const size_t offset = (millis() / period_ms) % cycle;
              std::string window = padded.substr(offset);
              if (window.size() < visible_chars) {
                window += padded.substr(0, visible_chars - window.size());
              }
              return window.substr(0, visible_chars);
            };
            const std::string zone = id(zone_display_value).empty() ? std::string("-") : id(zone_display_value);
            return marquee_text(zone, 16, 400);
      - lvgl.label.update:
          id: mute_badge_label
          text: !lambda return id(mute_display_value);
      - lvgl.label.update:
          id: power_badge_label
          text: !lambda return id(power_display_value);
      - lvgl.widget.update:
          id: mute_badge
          hidden: !lambda return id(mute_display_value).empty();
      - lvgl.widget.update:
          id: power_badge
          hidden: !lambda return id(power_display_value).empty();

  - id: activate_ui
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool dashboard_expired = id(ui_last_interaction_ms) == 0 || (now - id(ui_last_interaction_ms)) >= ${ui_timeout_ms};
          if (dashboard_expired) {
            id(screen_page) = 0;
          }
          id(ui_last_interaction_ms) = now;
      - script.execute: sync_ui

  - id: toggle_screen
    then:
      - lambda: |-
          id(screen_page) = id(screen_page) == 0 ? 1 : 0;
      - script.execute: activate_ui

  - id: next_config_row
    then:
      - lambda: |-
          id(config_row) = (id(config_row) + 1) % 3;
      - script.execute: activate_ui

  - id: select_zone_row
    then:
      - lambda: id(config_row) = 0;
      - script.execute: activate_ui

  - id: select_profile_row
    then:
      - lambda: id(config_row) = 1;
      - script.execute: activate_ui

  - id: select_source_row
    then:
      - lambda: id(config_row) = 2;
      - script.execute: activate_ui

  - id: button_single_press
    then:
      - script.execute: activate_ui
      - event.trigger:
          id: media_controls
          event_type: button_single

  - id: button_double_press
    then:
      - script.execute: activate_ui
      - event.trigger:
          id: media_controls
          event_type: button_double

  - id: button_long_press
    then:
      - script.execute: activate_ui
      - event.trigger:
          id: media_controls
          event_type: button_long

  - id: push_volume_target
    mode: restart
    then:
      - delay: 250ms
      - event.trigger:
          id: media_controls
          event_type: volume_apply

  - id: rotate_left_event
    then:
      - script.execute: activate_ui
      - if:
          condition:
            lambda: |-
              const uint32_t now = millis();
              if ((now - id(last_rotate_event_ms)) < ${rotate_debounce_ms}) {
                return false;
              }
              id(last_rotate_event_ms) = now;
              return id(screen_page) == 0;
          then:
            - lambda: |-
                id(volume_sync_hold_until_ms) = millis() + 1200;
                id(volume_cache) = std::max(-130.0f, id(volume_cache) - id(volume_step_value));
                char buffer[16];
                snprintf(buffer, sizeof(buffer), "%.1f dB", id(volume_cache));
                id(volume_display_value) = std::string(buffer);
                id(volume_display_text).publish_state(std::string(buffer));
            - script.execute: push_volume_target
            - script.execute: sync_ui
          else:
            - if:
                condition:
                  lambda: return id(screen_page) == 1 && id(config_row) == 0;
                then:
                  - event.trigger:
                      id: media_controls
                      event_type: zone_prev
                else:
                  - if:
                      condition:
                        lambda: return id(screen_page) == 1 && id(config_row) == 1;
                      then:
                        - event.trigger:
                            id: media_controls
                            event_type: profile_prev
                      else:
                        - event.trigger:
                            id: media_controls
                            event_type: source_prev

  - id: rotate_right_event
    then:
      - script.execute: activate_ui
      - if:
          condition:
            lambda: |-
              const uint32_t now = millis();
              if ((now - id(last_rotate_event_ms)) < ${rotate_debounce_ms}) {
                return false;
              }
              id(last_rotate_event_ms) = now;
              return id(screen_page) == 0;
          then:
            - lambda: |-
                id(volume_sync_hold_until_ms) = millis() + 1200;
                id(volume_cache) = std::min(0.0f, id(volume_cache) + id(volume_step_value));
                char buffer[16];
                snprintf(buffer, sizeof(buffer), "%.1f dB", id(volume_cache));
                id(volume_display_value) = std::string(buffer);
                id(volume_display_text).publish_state(std::string(buffer));
            - script.execute: push_volume_target
            - script.execute: sync_ui
          else:
            - if:
                condition:
                  lambda: return id(screen_page) == 1 && id(config_row) == 0;
                then:
                  - event.trigger:
                      id: media_controls
                      event_type: zone_next
                else:
                  - if:
                      condition:
                        lambda: return id(screen_page) == 1 && id(config_row) == 1;
                      then:
                        - event.trigger:
                            id: media_controls
                            event_type: profile_next
                      else:
                        - event.trigger:
                            id: media_controls
                            event_type: source_next

sensor:
  - platform: rotary_encoder
    id: dial_encoder
    name: "${friendly_name} Dial"
    pin_a:
      number: GPIO41
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO40
      mode:
        input: true
        pullup: true
    resolution: 1
    restore_mode: ALWAYS_ZERO
    entity_category: diagnostic
    on_clockwise:
      - script.execute: rotate_left_event
    on_anticlockwise:
      - script.execute: rotate_right_event

  - platform: wifi_signal
    id: wifi_rssi
    name: "${friendly_name} WiFi Signal"
    entity_category: diagnostic
    update_interval: 30s

binary_sensor:
  - platform: gpio
    id: front_button
    name: "${friendly_name} Button"
    pin:
      number: GPIO42
      mode:
        input: true
        pullup: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at least 360ms
        then:
          - script.execute: button_single_press
      - timing:
          - ON for at most 350ms
          - OFF for at most 350ms
          - ON for at most 350ms
          - OFF for at least 360ms
        then:
          - script.execute: button_double_press
      - timing:
          - ON for at least 700ms
        then:
          - script.execute: button_long_press

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip_address
      name: "${friendly_name} IP Address"
      entity_category: diagnostic

  - platform: template
    id: rtc_clock
    name: "${friendly_name} RTC Clock"
    icon: mdi:clock-outline
    lambda: |-
      auto now = id(rtc_time).now();
      if (!now.is_valid()) {
        return std::string("--:--");
      }
      char buffer[6];
      snprintf(buffer, sizeof(buffer), "%02d:%02d", now.hour, now.minute);
      return std::string(buffer);
    update_interval: 30s
    on_value:
      - script.execute: sync_ui

  - platform: template
    id: rtc_date
    name: "${friendly_name} RTC Date"
    icon: mdi:calendar
    lambda: |-
      auto now = id(rtc_time).now();
      if (!now.is_valid()) {
        return std::string("----/--/--");
      }
      char buffer[11];
      snprintf(buffer, sizeof(buffer), "%04d/%02d/%02d", now.year, now.month, now.day_of_month);
      return std::string(buffer);
    update_interval: 5min
    on_value:
      - script.execute: sync_ui

text:
  - platform: template
    id: zone_display_text
    name: "${friendly_name} Zone Display"
    optimistic: true
    restore_value: true
    initial_value: "-"
    mode: text
    set_action:
      - lambda: |-
          id(zone_display_value) = x.empty() ? std::string("-") : x;
      - script.execute: sync_ui

  - platform: template
    id: profile_display_text
    name: "${friendly_name} Profile Display"
    optimistic: true
    restore_value: true
    initial_value: "-"
    mode: text
    set_action:
      - lambda: |-
          id(profile_display_value) = x.empty() ? std::string("-") : x;
      - script.execute: sync_ui

  - platform: template
    id: source_display_text
    name: "${friendly_name} Source Display"
    optimistic: true
    restore_value: true
    initial_value: "-"
    mode: text
    set_action:
      - lambda: |-
          id(source_display_value) = x.empty() ? std::string("-") : x;
      - script.execute: sync_ui

  - platform: template
    id: mute_display_text
    name: "${friendly_name} Mute Display"
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text
    set_action:
      - lambda: |-
          id(mute_display_value) = x;
      - script.execute: sync_ui

  - platform: template
    id: power_display_text
    name: "${friendly_name} Power Display"
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text
    set_action:
      - lambda: |-
          id(power_display_value) = x;
      - script.execute: sync_ui

  - platform: template
    id: volume_display_text
    name: "${friendly_name} Volume Display"
    optimistic: true
    restore_value: true
    initial_value: "-20.0 dB"
    mode: text
    set_action:
      - lambda: |-
          const std::string value = x.empty() ? std::string("-20.0 dB") : x;
          if (millis() < id(volume_sync_hold_until_ms) && value != id(volume_display_value)) {
            return;
          }
          id(volume_display_value) = value;
          std::string numeric = value;
          if (numeric.size() > 3 && numeric.substr(numeric.size() - 3) == " dB") {
            numeric = numeric.substr(0, numeric.size() - 3);
          }
          id(volume_cache) = strtof(numeric.c_str(), nullptr);
      - script.execute: sync_ui

button:
  - platform: template
    name: "${friendly_name} Refresh Display"
    on_press:
      - script.execute: activate_ui

  - platform: template
    name: "${friendly_name} Sync RTC"
    on_press:
      - bm8563.write_time:
          id: rtc_time

  - platform: template
    name: "${friendly_name} Read RTC"
    on_press:
      - bm8563.read_time:
          id: rtc_time

  - platform: template
    name: "${friendly_name} Buzzer Test"
    on_press:
      - lambda: |-
          id(buzzer_output).update_frequency(id(buzzer_frequency));
      - rtttl.play: "two_short:d=4,o=5,b=100:16e6,16e6"

touchscreen:
  - platform: ft5x06
    id: dial_touch
    i2c_id: internal_i2c
    display: round_display
    address: 0x38
    interrupt_pin: GPIO14
    on_touch:
      - lambda: |-
          id(swipe_handled) = false;
      - script.execute: activate_ui
    on_update:
      - lambda: |-
          if (id(swipe_handled)) {
            return;
          }
          for (auto touch : touches) {
            const int dx = touch.x - touch.x_org;
            const int dy = touch.y - touch.y_org;
            if (abs(dx) >= ${swipe_threshold_px} && abs(dx) > (abs(dy) * 3 / 2)) {
              id(swipe_handled) = true;
              id(toggle_screen).execute();
              break;
            }
          }
    on_release:
      - lambda: |-
          id(swipe_handled) = false;

display:
  - platform: mipi_spi
    id: round_display
    model: GC9A01A
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    invert_colors: true
    auto_clear_enabled: false
    dimensions:
      width: 240
      height: 240
    update_interval: never

lvgl:
  displays:
    - round_display
  touchscreens:
    - dial_touch
  theme:
    obj:
      bg_color: 0x050607
      text_color: 0xF3F5F7
      border_width: 0
      pad_all: 0
    button:
      text_font: font_small
      radius: 18
      bg_color: 0x101214
      border_color: 0x2E3438
      border_width: 2
      text_color: 0xD6DADF
      checked:
        bg_color: 0x163226
        border_color: 0x78D69B
        text_color: 0xFFFFFF
    label:
      text_color: 0xF3F5F7
    arc:
      arc_color: 0x1C2226
      indicator:
        arc_color: 0x78D69B
        arc_width: 8
      knob:
        bg_color: 0xC7F7D8
  pages:
    - id: disconnected_page
      bg_color: 0x050607
      widgets:
