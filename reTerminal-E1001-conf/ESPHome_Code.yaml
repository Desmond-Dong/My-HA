# 在线图片获取

online_image:
  - id: dashboard_image
    format: BMP
    type: BINARY
    buffer_size: 65535
    url: http://172.16.1.119:10000/lovelace/2?viewport=800x480&eink=2&format=bmp&lang=zh-cn
    on_download_finished:
      - component.update: epaper_display

# 墨水屏显示
display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never   # 不自动刷新，靠 on_time 来触发
    lambda: |-
      id(disp_count)++;                     // 刷新次数统计（诊断）
      it.image(0, 0, id(dashboard_image));
