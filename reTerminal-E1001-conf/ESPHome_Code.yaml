binary_sensor:
  - platform: status
    name: "API Connected"
    entity_category: diagnostic
  - platform: gpio    # Next page / Voice assistant
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: key1
    name: "Key1"
    on_press:
      - micro_wake_word.stop:
      - voice_assistant.start:
    on_release:
      - voice_assistant.stop:
  - platform: gpio     # Prev page
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: key2
    name: "Key2"
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms

  - platform: gpio     # Key3 物理刷新按键
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: key3
    name: "Key3"
    on_press:
      - component.update: dashboard_image
          

