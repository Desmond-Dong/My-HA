esphome:
  name: e1001
  friendly_name: E1001
  on_boot:
    priority: 800
    then:
      - switch.turn_on: mic_enable
      - delay: 30s
      - component.update: dashboard_image
 #     - output.turn_on: bsp_sd_enable
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      # 开关为关机状态时停掉开机自动开始的 BLE 扫描
      - if:
          condition:
            lambda: 'return !id(ble_switch).state;'
          then:
            - lambda: 'id(ble_tracker)->stop_scan();'

esp32:
  board: seeed_xiao_esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      # ESP-IDF 对 32MB flash 的支持被标记为实验性，OTA 必须开启此项
      enable_idf_experimental_features: true
# Enable logging
logger:
  hardware_uart: UART0
#  level: VERY_VERBOSE
#  logs:
#    microphone: VERY_VERBOSE
#    i2s_audio: VERY_VERBOSE
# Enable Home Assistant API
api:
  encryption:
    key: "lY+oz71tYyiQ8XgimOxMd6pYEyWhLzzXqhNYsZatTmw="
  on_client_connected:
    - micro_wake_word.start:
  services: # for playing music via Home Assistant
    - service: play_song
      variables:
        song_data: string
      then:
        - lambda: |-
            auto *bz = id(buzzer_pwm);
            std::string s = song_data;
            size_t start = 0;

            while (true) {
              size_t comma = s.find(',', start);
              std::string note = s.substr(start, comma - start);
              if (note.empty()) break;

              size_t colon = note.find(':');
              if (colon != std::string::npos) {
                int freq = atoi(note.substr(0, colon).c_str());
                int dur  = atoi(note.substr(colon + 1).c_str());

                if (freq > 0) {
                  // ✅ 正确写法
                  bz->update_frequency(freq);
                  bz->set_level(0.6);
                } else {
                  bz->set_level(0);
                }
                delay(dur);
              }

              if (comma == std::string::npos) break;
              start = comma + 1;
            }

            bz->set_level(0);
ota:
  - platform: esphome
    password: "6abb3deae74569ff3725fde6bac204e8"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Reterminal-E1001"
    password: "dkX2Ni4kwEQh"
