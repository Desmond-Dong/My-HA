#  version: 3
psram:
  mode: octal
  speed: 80MHz

captive_portal:

# BLE Proxy
esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    active: true
bluetooth_proxy:
  active: true

# Deep-sleep, wake by GPIO4
