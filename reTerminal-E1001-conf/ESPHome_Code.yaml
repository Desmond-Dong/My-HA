i2s_audio:
  i2s_lrclk_pin: GPIO42

microphone:
  - platform: i2s_audio
    id: pdm_microphone
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO41

voice_assistant:
  microphone: pdm_microphone
  use_wake_word: false
  on_listening:
    - logger.log: "Listening..."
  on_stt_end:
    - logger.log: "Speech-to-text ended"
  on_tts_start:
    - logger.log: "TTS started"
  on_end:
    - logger.log: "Voice assistant ended"
    - micro_wake_word.start:
  on_error:
    - logger.log:
        format: "Voice assistant error: %s"
        args: [ 'code.c_str()' ]

micro_wake_word:
  microphone: pdm_microphone
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - light.turn_on:
        id: buzzer
        brightness: 60%
    - delay: 100ms
    - light.turn_off: buzzer
    - logger.log: "Wake word detected"
    - voice_assistant.start:

debug:
  update_interval: 30s

    
# SPI / I²C
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
i2c:
  scl: GPIO20
  sda: GPIO19
light:
#  - platform: binary
#    name: "Onboard LED"
#    output: bsp_led
#    id: onboard_led
  - platform: monochromatic
    output: buzzer_pwm
    icon: "mdi:volume-high"
    name: "Buzzer"
    id: buzzer
    # Setting transition length to 0s makes the buzzer turn on and off instantly.
    default_transition_length: 0s
switch:
  - platform: template
    name: "Refresh"
    id: refresh_display
    turn_on_action:
      - lambda: |-
          id(dashboard_image).set_url(id(custom_url_input).state);
          id(dashboard_image).update();
          
      - delay: 500ms
      - switch.turn_off: refresh_display
  - platform: gpio
    pin: GPIO38
    id: mic_enable
    restore_mode: ALWAYS_ON
    internal: true

  # BLE 代理开关（HA 中可控制）：关闭后停止持续 BLE 扫描以省电
  - platform: template
    name: "BLE Proxy"
    id: ble_switch
    icon: "mdi:bluetooth"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: 'id(ble_tracker)->start_scan();'
    turn_off_action:
      - lambda: 'id(ble_tracker)->stop_scan();'
