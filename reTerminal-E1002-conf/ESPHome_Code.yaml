    id: f_small
    size: 12
    glyphs: "0123456789-.: ·共元笔时间地点金额余EPSHome高低°"
  - file:
      type: local
      path: fonts/ZenMaruGothicSC-Bold.ttf
    id: f_th
    size: 15
    glyphs: "时间地点金额余日一二三四五六"
  - file:
      type: local
      path: fonts/ZenMaruGothicSC-Medium.ttf
    id: f_body
    size: 15
    glyphs: !include font_glyphs_cjk.yaml

# ---------------------------------------------------------------------
# 墨水屏显示（六色: 黑/白/红/绿/蓝/黄）
# ---------------------------------------------------------------------
display:
  - platform: epaper_spi
    id: epaper_display
    model: 7.3in-spectra-e6
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never   # 手动刷新：整点 / 按键 / Refresh 开关 / HA 数据变化
    lambda: |-
      auto BLACK = Color(0, 0, 0);
      auto WHITE = Color(255, 255, 255);
      auto RED   = Color(255, 0, 0);
      auto GREEN = Color(0, 255, 0);
      auto BLUE  = Color(0, 0, 255);
      auto YELLOW = Color(255, 255, 0);
      id(disp_count)++;                     // 刷新次数统计（诊断）
      // 电量 <5% 清屏保护（防残影；充电回升后自动恢复显示）
      if (id(screen_blank) || (!isnan(id(battery_level).state) && id(battery_level).state < 5)) {
        it.fill(WHITE);
        return;
      }
      it.fill(WHITE);

      // 圆角矩形填充（HTML 圆角 20px/16px 的近似）
      auto round_fill = [&](int x, int y, int wd, int ht, int r, Color c) {
        it.filled_rectangle(x + r, y, wd - 2 * r, ht, c);
        it.filled_rectangle(x, y + r, r, ht - 2 * r, c);
        it.filled_rectangle(x + wd - r, y + r, r, ht - 2 * r, c);
        it.filled_circle(x + r, y + r, r, c);
        it.filled_circle(x + wd - r - 1, y + r, r, c);
        it.filled_circle(x + r, y + ht - r - 1, r, c);
        it.filled_circle(x + wd - r - 1, y + ht - r - 1, r, c);
      };
      // 圆角描边（thick=1/2，白色内芯）
      auto round_frame = [&](int x, int y, int wd, int ht, int r, int thick, Color c) {
        round_fill(x, y, wd, ht, r, c);
        round_fill(x + thick, y + thick, wd - 2 * thick, ht - 2 * thick,
                   r - thick > 0 ? r - thick : 1, WHITE);
      };

      auto now = id(sntp_time).now();
      static const char *WDS[7] = {"日", "一", "二", "三", "四", "五", "六"};
      const char *wd = now.is_valid() ? WDS[(now.day_of_week - 1 + 7) % 7] : "";

      // ============ 顶部图标条：室内温度 / 湿度 / Wi-Fi / 电池 ============
      float t = id(temp_sensor).state;
      float h = id(hum_sensor).state;
      float w = id(wifi_signal1).state;
      float b = id(battery_level).state;
      // 温度：图标+数值横排
      it.printf(12, 16, id(f_icon), BLUE, display::TextAlign::TOP_LEFT, "\U000F050F");
      if (isnan(t)) it.printf(40, 20, id(f_strip), BLUE, display::TextAlign::TOP_LEFT, "--");
      else it.printf(40, 20, id(f_strip), BLUE, display::TextAlign::TOP_LEFT, "%.1f°", t);
      // 湿度：图标+数值横排
      it.printf(104, 16, id(f_icon), BLUE, display::TextAlign::TOP_LEFT, "\U000F058E");
      if (isnan(h)) it.printf(132, 20, id(f_strip), BLUE, display::TextAlign::TOP_LEFT, "--");
      else it.printf(132, 20, id(f_strip), BLUE, display::TextAlign::TOP_LEFT, "%.0f%%", h);
      // Wi-Fi：仅图标（按强度变色：蓝/黄/红）
      static const char *BAT_IC[10] = {"\U000F007A", "\U000F007B", "\U000F007C", "\U000F007D",
                                       "\U000F007E", "\U000F007F", "\U000F0080", "\U000F0081",
                                       "\U000F0082", "\U000F0079"};
      std::string wf_ic = "\U000F092D";
      Color wcol = RED;
      if (!isnan(w)) {
        if (w >= -60) { wf_ic = "\U000F0928"; wcol = BLUE; }
        else if (w >= -70) { wf_ic = "\U000F0925"; wcol = BLUE; }
        else if (w >= -80) { wf_ic = "\U000F0922"; wcol = YELLOW; }
        else { wf_ic = "\U000F091F"; wcol = RED; }
      }
      it.printf(210, 16, id(f_icon), wcol, display::TextAlign::TOP_LEFT, "%s", wf_ic.c_str());
      // 电池：仅图标（按电量变色：蓝/黄/红，<20% 红色警示图标）
      std::string bat_ic = "\U000F0083";
      Color bcol = RED;
      if (!isnan(b)) {
        if (b < 20) { bcol = RED; bat_ic = "\U000F0083"; }
        else {
          bcol = (b >= 50) ? BLUE : YELLOW;
          bat_ic = (b >= 95) ? "\U000F0079" : BAT_IC[std::min(8, std::max(1, (int)(b / 10)) - 1)];
        }
      }
      it.printf(270, 16, id(f_icon), bcol, display::TextAlign::TOP_LEFT, "%s", bat_ic.c_str());

      // ============ 日期 / 时间（蓝底白字）============
      round_fill(12, 70, 292, 84, 10, BLUE);
      if (now.is_valid()) {
        it.printf(158, 78, id(f_date), WHITE, display::TextAlign::TOP_CENTER, "%d年%d月%d日 星期%s", now.year, now.month, now.day_of_month, wd);
        it.printf(158, 112, id(f_clock), WHITE, display::TextAlign::TOP_CENTER, "%02d:%02d", now.hour, now.minute);
      } else {
        it.printf(158, 112, id(f_clock), WHITE, display::TextAlign::TOP_CENTER, "--:--");
      }

      // 蓝卡：天气（白色大图标 + 温度区间）
      round_fill(12, 166, 292, 56, 10, BLUE);
      std::string wst = id(weather_condition).state;
      std::string wicon = "";
      if (wst == "sunny") { wicon = "\U000F0599"; }
      else if (wst == "clear-night") { wicon = "\U000F0594"; }
      else if (wst == "partlycloudy") { wicon = "\U000F0595"; }
      else if (wst == "cloudy") { wicon = "\U000F0590"; }
      else if (wst == "fog") { wicon = "\U000F0591"; }
      else if (wst == "hail") { wicon = "\U000F0592"; }
      else if (wst == "lightning") { wicon = "\U000F0593"; }
      else if (wst == "lightning-rainy") { wicon = "\U000F067E"; }
      else if (wst == "pouring") { wicon = "\U000F0596"; }
      else if (wst == "rainy") { wicon = "\U000F0597"; }
      else if (wst == "snowy") { wicon = "\U000F0598"; }
      else if (wst == "snowy-rainy") { wicon = "\U000F067F"; }
      else if (wst == "windy") { wicon = "\U000F059D"; }
      else if (wst == "windy-variant") { wicon = "\U000F059E"; }
      if (!wicon.empty())
        it.printf(24, 174, id(f_weather), WHITE, display::TextAlign::TOP_LEFT, "%s", wicon.c_str());
      if (id(fc_valid) && !isnan(id(fc_high))) {
        if (id(fc_has_low))
          it.printf(288, 184, id(f_range), WHITE, display::TextAlign::TOP_RIGHT, "%.0f~%.0f℃", id(fc_low), id(fc_high));
        else
          it.printf(288, 184, id(f_range), WHITE, display::TextAlign::TOP_RIGHT, "%.0f℃", id(fc_high));
      } else {
        it.printf(288, 184, id(f_range), WHITE, display::TextAlign::TOP_RIGHT, "--");
      }

      // 红色面板分隔线
      it.filled_rectangle(316, 0, 2, 480, RED);

      // ============ 右侧：校园卡消费日报卡片（仿 dk-card-report.html）============
      const int cx = 336, cy = 12, cw = 448, chh = 456;
      round_frame(cx, cy, cw, chh, 10, 2, BLUE);   // 卡片圆角边框 2px 蓝色
      const int ix = cx + 24;                // 内容左边界 360
      const int ir = cx + cw - 24;           // 内容右边界 760
      const int num_r = ix + 360;            // 数字右对齐位置 720

      // 页面选择：0=校园卡消费日报 1=月日历；当日无消费时默认日历页
      if (id(page_auto)) {
        id(page_index) = (id(rec_today_count) == 0) ? 1 : 0;
      }
      if (id(page_index) == 1) {
        // ============ 月日历页（今天黄圈高亮）============
        it.printf(560, 88, id(f_date), BLACK, display::TextAlign::TOP_CENTER, "%d年%d月", now.year, now.month);
        static const char *WD[7] = {"日", "一", "二", "三", "四", "五", "六"};
        for (int c = 0; c < 7; c++)
          it.printf(ix + c * 57 + 28, 122, id(f_th), (c == 0 || c == 6) ? RED : BLACK, display::TextAlign::TOP_CENTER, "%s", WD[c]);
        it.line(ix, 146, ir, 146, BLACK);
        int dim = 31;
        if (now.month == 2) dim = ((now.year % 4 == 0 && now.year % 100 != 0) || now.year % 400 == 0) ? 29 : 28;
        else if (now.month == 4 || now.month == 6 || now.month == 9 || now.month == 11) dim = 30;
        int dow1 = ((now.day_of_week - now.day_of_month) % 7 + 7) % 7;   // 0=周日
        for (int r = 0; r < 6; r++) {
          for (int c = 0; c < 7; c++) {
            int day = r * 7 + c - dow1 + 1;
            if (day < 1 || day > dim) continue;
            int cx2 = ix + c * 57 + 28;
            int cy2 = 160 + r * 50;
            bool weekend = (c == 0 || c == 6);   // 周日/周六列
            if (day == now.day_of_month) {
              round_fill(cx2 - 24, cy2 - 9, 48, 36, 6, BLACK);   // 今天：黑底白字
              it.printf(cx2, cy2 - 14, id(f_big), WHITE, display::TextAlign::TOP_CENTER, "%d", day);
            } else {
              it.printf(cx2, cy2 - 14, id(f_big), weekend ? RED : BLACK, display::TextAlign::TOP_CENTER, "%d", day);
            }
          }
        }
      } else {
        // ============ 校园卡消费日报页 ============

      // -- 头部蓝色横幅（白字标题居中，顶角与卡片同圆角）--
      round_fill(cx + 2, cy + 2, cw - 4, 64, 8, BLUE);
      it.filled_rectangle(cx + 2, cy + 34, cw - 4, 32, BLUE);
      it.printf(cx + cw / 2, 36, id(f_title), WHITE, display::TextAlign::TOP_CENTER, "校园卡消费日报");

      // -- 余额框（黄底，低于100元金额标红）--
      float balance = isnan(id(card_balance).state) ? 0.0f : id(card_balance).state;
      round_fill(ix, 88, ir - ix, 54, 8, YELLOW);
      it.printf(ix + 18, 108, id(f_label), BLACK, display::TextAlign::TOP_LEFT, "卡内余额");
      it.printf(num_r, 98, id(f_big), balance < 100 ? RED : BLACK, display::TextAlign::TOP_RIGHT, "%.2f", balance);
      it.printf(num_r + 8, 114, id(f_label), BLACK, display::TextAlign::TOP_LEFT, "元");

      // -- 今日消费（笔数从明细中按当天日期统计）--
      float dsum = isnan(id(card_today_total).state) ? 0.0f : id(card_today_total).state;
      it.printf(ix, 162, id(f_sect), BLACK, display::TextAlign::TOP_LEFT, "今日消费");
      it.printf(ir, 166, id(f_small), BLUE, display::TextAlign::TOP_RIGHT, "共 %.2f 元 · %d 笔", dsum, (int) id(rec_today_count));

      // -- 表头（加粗加大）--
      it.printf(ix, 196, id(f_th), BLACK, display::TextAlign::TOP_LEFT, "时间");
      it.printf(424, 196, id(f_th), BLACK, display::TextAlign::TOP_LEFT, "地点");
      it.printf(640, 196, id(f_th), BLACK, display::TextAlign::TOP_RIGHT, "金额");
      it.printf(ir, 196, id(f_th), BLACK, display::TextAlign::TOP_RIGHT, "余额");
      it.line(ix, 216, ir, 216, BLACK);

      // 地点超长截断
      auto trunc = [](const std::string &s, size_t maxc) {
        size_t n = 0, i = 0;
        while (i < s.size()) {
          if ((s[i] & 0xC0) != 0x80) { if (n >= maxc) break; n++; }
          i++;
        }
        return s.substr(0, i);
      };

      // -- 消费明细（金额红色高亮，行间蓝色细分隔线）--
      int ry = 222;
      if (id(rec_count) == 0) {
        it.printf(ix, 234, id(f_body), BLUE, display::TextAlign::TOP_LEFT, "暂无消费记录");
        ry += 33;
      }
      for (int i = 0; i < id(rec_count) && i < 5; i++) {
        it.printf(ix, ry, id(f_body), BLACK, display::TextAlign::TOP_LEFT, "%s", id(rec_time)[i].c_str());
        it.printf(424, ry, id(f_body), BLACK, display::TextAlign::TOP_LEFT, "%s", trunc(id(rec_place)[i], 7).c_str());
        it.printf(640, ry, id(f_body), RED, display::TextAlign::TOP_RIGHT, "%s", id(rec_amount)[i].c_str());
        it.printf(ir, ry, id(f_body), BLACK, display::TextAlign::TOP_RIGHT, "%s", id(rec_balance)[i].c_str());
        if (i < 4 && i < id(rec_count) - 1) it.line(ix, ry + 27, ir, ry + 27, BLUE);
        ry += 33;
      }

      // -- 昨日消费框（白底绿边，黑字更清晰）--
      float ysum = isnan(id(card_yesterday_total).state) ? 0.0f : id(card_yesterday_total).state;
      int by = ry + 8;
      round_frame(ix, by, ir - ix, 42, 7, 2, GREEN);
      it.printf(ix + 18, by + 14, id(f_label), BLACK, display::TextAlign::TOP_LEFT, "昨日消费");
      it.printf(num_r, by + 9, id(f_mon), BLACK, display::TextAlign::TOP_RIGHT, "%.2f", ysum);
      it.printf(num_r + 8, by + 16, id(f_label), BLACK, display::TextAlign::TOP_LEFT, "元");
      }
      // 页码指示点
      it.circle(738, 456, 4, BLUE);
      it.circle(754, 456, 4, BLUE);
      it.filled_circle((id(page_index) == 0) ? 738 : 754, 456, 4, BLUE);

