# =====================================================================
# reTerminal E1002 (7.3" Spectra E6 六色墨水屏 800x480) — 原生绘制 UI
#   左侧 : 时钟 / 日期 + 本机温湿度 / WiFi / 电池
#   右侧 : 校园卡消费日报卡片（样式仿 dk-card-report.html），数据全部来自 HA
# 可用颜色: 黑 / 白 / 红 / 绿 / 蓝 / 黄
# =====================================================================
esphome:
  name: e1002
  friendly_name: E1002
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_sd_enable
      - output.turn_on: mic_power_enable
      - pcf8563.read_time:               # 无网络时用 RTC 恢复系统时间
      - delay: 25s                       # 等 HA 连接与数据到位
      - script.execute: fetch_forecast   # 拉取今日高/低温
      - delay: 3s
      - component.update: epaper_display
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      # 开关为关机状态时停掉开机自动开始的 BLE 扫描
      - if:
          condition:
            lambda: 'return !id(ble_switch).state;'
          then:
            - lambda: 'id(ble_tracker)->stop_scan();'

# ---------------------------------------------------------------------
# ↓↓↓ 易校园集成实体 ↓↓↓
substitutions:
  card_balance_entity: "sensor.yi_xiao_yuan_xiao_yuan_qia_dong_zhe_nan_xiao_yuan_qia_yu_e"   # 卡内余额
  card_today_total_entity: "sensor.yi_xiao_yuan_xiao_yuan_qia_dong_zhe_nan_jin_ri_xiao_fei"  # 今日消费
  card_yesterday_entity: "sensor.yi_xiao_yuan_xiao_yuan_qia_dong_zhe_nan_zuo_ri_xiao_fei"    # 昨日消费
  card_records_entity: "sensor.yi_xiao_yuan_xiao_yuan_qia_dong_zhe_nan_xiao_fei_ming_xi"     # 消费明细
  weather_entity: "weather.he_feng_tian_qi"                                                  # 和风天气

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB          # reTerminal E1002 官方规格: 32MB Flash / 8MB PSRAM
  framework:
    type: esp-idf
    advanced:
      # ESP-IDF 对 32MB flash 的支持被标记为实验性，OTA 必须开启此项
      enable_idf_experimental_features: true

logger:

api:
  encryption:
    key: !secret e1002__encryption_key
  on_client_connected:
    - script.execute: fetch_forecast
  actions:
    - action: play_song
      variables:
        song_data: string
      then:
        - lambda: |-
            auto *bz = id(buzzer_pwm);
            std::string s = song_data;
            size_t start = 0;

            while (true) {
              size_t comma = s.find(',', start);
              std::string note = s.substr(start, comma - start);
              if (note.empty()) break;

              size_t colon = note.find(':');
              if (colon != std::string::npos) {
                int freq = atoi(note.substr(0, colon).c_str());
                int dur  = atoi(note.substr(colon + 1).c_str());

                if (freq > 0) {
                  bz->update_frequency(freq);
                  bz->set_level(0.6);
                } else {
                  bz->set_level(0);
                }
                delay(dur);
              }

              if (comma == std::string::npos) break;
              start = comma + 1;
            }

            bz->set_level(0);

ota:
  - platform: esphome
    password: "your ota password"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: octal
  speed: 80MHz

debug:
  update_interval: 30s

captive_portal:

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

i2c:
  scl: GPIO20
  sda: GPIO19

# ---------------------------------------------------------------------
# 全局变量：消费记录表（最多 6 条，界面画 5 条）
globals:
  - id: rec_raw
    type: std::string
    restore_value: no
  - id: rec_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: rec_today_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: rec_time
    type: 'std::string[6]'
    restore_value: no
  - id: rec_place
    type: 'std::string[6]'
    restore_value: no
  - id: rec_amount
    type: 'std::string[6]'
    restore_value: no
  - id: rec_balance
    type: 'std::string[6]'
    restore_value: no
  - id: fc_high
    type: float
    restore_value: no
    initial_value: '0'
  - id: fc_low
    type: float
    restore_value: no
    initial_value: '0'
  - id: fc_has_low
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: fc_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: fc_status
    type: std::string
    restore_value: no
  - id: disp_count
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: screen_blank
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: page_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: page_auto
    type: bool
    restore_value: no
    initial_value: 'true'

script:

  # 解析消费明细（HA 对列表属性发的是 Python str() 格式: [{'时间': '...'}, ...]）
  - id: parse_records
    mode: queued
    then:
      - lambda: |-
          id(rec_count) = 0;
          id(rec_today_count) = 0;
          const std::string &raw = id(rec_raw);
          auto nowp = id(sntp_time).now();
          char today[16] = "";
          if (nowp.is_valid())
            snprintf(today, sizeof(today), "%04d-%02d-%02d", nowp.year, nowp.month, nowp.day_of_month);

          // 取 'key': 'value' 的 value；数值型值走兜底分支
          auto get_field = [](const std::string &rec, const std::string &key) -> std::string {
            std::string pat = "'" + key + "': '";
            size_t p = rec.find(pat);
            if (p != std::string::npos) {
              size_t v = p + pat.size();
              size_t e = rec.find('\'', v);
              if (e != std::string::npos) return rec.substr(v, e - v);
            }
            std::string pat2 = "'" + key + "': ";
            size_t p2 = rec.find(pat2);
            if (p2 != std::string::npos) {
              size_t v = p2 + pat2.size();
              size_t e = rec.find_first_of(",}", v);
              if (e == std::string::npos) e = rec.size();
              std::string val = rec.substr(v, e - v);
              size_t b = val.find_first_not_of(' ');
              if (b == std::string::npos) return "";
              size_t t = val.find_last_not_of(' ');
              return val.substr(b, t - b + 1);
            }
            return "";
          };

          size_t pos = 0;
          while ((pos = raw.find("{'", pos)) != std::string::npos) {
            size_t end = raw.find('}', pos);
            size_t len = (end == std::string::npos ? raw.size() : end) - pos - 1;
            std::string rec = raw.substr(pos + 1, len);

            std::string t = get_field(rec, "时间");
            // 时间未同步时不过滤，先显示最近的
            bool is_today = (today[0] == 0) || (t.compare(0, 10, today) == 0);
            if (is_today) {
              if (id(rec_today_count) < 99) id(rec_today_count)++;
              if (id(rec_count) < 6) {
                int i = id(rec_count)++;
                id(rec_time)[i]    = (t.size() >= 16) ? t.substr(11, 5) : t;
                id(rec_place)[i]   = get_field(rec, "地点");
                id(rec_amount)[i]  = get_field(rec, "金额");
                id(rec_balance)[i] = get_field(rec, "余额");
              }
            }
            if (end == std::string::npos) break;
            pos = end + 1;
          }

  # 调用 HA weather.get_forecasts 服务获取今日高/低温（和风天气用 websocket 预报，无属性可订阅）
  - id: fetch_forecast
    mode: queued
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${weather_entity}
            type: daily
          capture_response: true
          on_success:
            - lambda: |-
                #include "esphome/components/json/json_util.h"
                JsonObjectConst first = response["response"]["${weather_entity}"]["forecast"][0];
                // 字段名兜底：不同 HA 版本可能带/不带 native_ 前缀
                float hi = first["temperature"] | first["native_temperature"] | NAN;
                float lo = first["templow"] | first["native_templow"] | NAN;
                id(fc_high) = hi;
                id(fc_low) = lo;
                id(fc_has_low) = !isnan(lo);
                id(fc_valid) = !isnan(hi);
                char st[32];
                snprintf(st, sizeof(st), "OK %.0f/%.0f", hi, lo);
                id(fc_status) = st;
                if (isnan(hi)) ESP_LOGW("fc", "forecast keys missing");
          on_error:
            - lambda: |-
                id(fc_status) = "ERROR";
                id(fc_valid) = false;
                ESP_LOGW("fc", "weather.get_forecasts failed");
light:
  - platform: monochromatic
    icon: "mdi:volume-high"
    output: buzzer_pwm
    name: "Buzzer"
    id: buzzer
    default_transition_length: 0s
  - platform: binary
    name: "Onboard LED"
    output: led_output
    id: onboard_led

switch:
  - platform: template
    name: "Refresh"
    id: refresh_display
    turn_on_action:
      - component.update: epaper_display
      - delay: 200ms
      - switch.turn_off: refresh_display

  # BLE 代理开关（HA 中可控制）：关闭后停止持续 BLE 扫描以省电
  - platform: template
    name: "BLE Proxy"
    id: ble_switch
    icon: "mdi:bluetooth"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: 'id(ble_tracker)->start_scan();'
    turn_off_action:
      - lambda: 'id(ble_tracker)->stop_scan();'

sensor:
  # ---- 本机传感器 ----
  - platform: sht4x
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Humidity"
      id: hum_sensor
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: wifi_signal1
    entity_category: diagnostic
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic
    block:
      name: "Heap Max Block"
      entity_category: diagnostic
    min_free:
      name: "Heap Min Free"
      entity_category: diagnostic
    loop_time:
      name: "Loop Time"
      entity_category: diagnostic
    psram:
      name: "Free PSRAM"
      entity_category: diagnostic
    fragmentation:
      name: "Heap Fragmentation"
      entity_category: diagnostic
    cpu_frequency:
      name: "CPU Frequency"
      entity_category: diagnostic
  - platform: template
    name: "Display Refresh Count"
    id: disp_count_sensor
    entity_category: diagnostic
    icon: "mdi:refresh"
    update_interval: 60s
    lambda: 'return (float) id(disp_count);'
  - platform: internal_temperature
    name: "Chip Temperature"
    id: chip_temp
    entity_category: diagnostic
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 60s
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    entity_category: diagnostic
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x) && x < 5.0f && !id(screen_blank);'
            then:
              - lambda: 'id(screen_blank) = true;'
              - component.update: epaper_display
        - if:
            condition:
              lambda: 'return !isnan(x) && x >= 5.0f && id(screen_blank);'
            then:
              - lambda: 'id(screen_blank) = false;'
              - component.update: epaper_display
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  # ---- 来自 HA 的校园卡数据 ----
  - platform: homeassistant
    id: card_balance
    name: "Card Balance"
    internal: true
    entity_id: ${card_balance_entity}
    unit_of_measurement: "元"
    accuracy_decimals: 2
  - platform: homeassistant
    id: card_today_total
    name: "Card Today Total"
    internal: true
    entity_id: ${card_today_total_entity}
    unit_of_measurement: "元"
    accuracy_decimals: 2
  - platform: homeassistant
    id: card_yesterday_total
    name: "Card Yesterday Total"
    internal: true
    entity_id: ${card_yesterday_entity}
    unit_of_measurement: "元"
    accuracy_decimals: 2

# ---------------------------------------------------------------------
# 消费明细 text_sensor：读取「明细」属性（JSON 数组），解析出今天的记录
# 明细格式（每条）：时间 / 地点 / 金额 / 余额 / 类型，时间 "2026-08-30 17:27:35"
# 只保留今天的记录，最多显示 5 条；今日笔数从明细中统计
text_sensor:
  # ---- 诊断信息 ----
  - platform: debug
    device:
      name: "Device Info"
      entity_category: diagnostic
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic
  - platform: uptime
    name: "Uptime Human"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    bssid:
      name: "Connected BSSID"
      entity_category: diagnostic
    dns_address:
      name: "DNS Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
  - platform: template
    name: "Weather FC Status"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return id(fc_status);'

  - platform: homeassistant
    id: card_records
    name: "Card Records"
    internal: true
    entity_id: ${card_records_entity}
    attribute: "明细"
    on_value:
      then:
        - lambda: |-
            if (x == id(rec_raw)) return;   // 内容没变
            id(rec_raw) = x;
            id(parse_records).execute();

  # 天气现象（实体状态: sunny/rainy/... ）
  - platform: homeassistant
    id: weather_condition
    name: "Weather Condition"
    internal: true
    entity_id: ${weather_entity}

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable
  - platform: gpio
    pin: GPIO16
    id: bsp_sd_enable
  - platform: gpio
    pin: GPIO38
    id: mic_power_enable
  - platform: gpio
    pin: GPIO6
    id: led_output
    inverted: true
  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm
    frequency: 1000Hz

# PDM 麦克风（时钟 GPIO42 / 数据 GPIO41）
i2s_audio:
  i2s_lrclk_pin: GPIO42

microphone:
  - platform: i2s_audio
    id: onboard_mic
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO41

binary_sensor:
  - platform: status
    name: "API Connected"
    entity_category: diagnostic
  - platform: gpio
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    id: sd_card_detect
    name: "SD Card Detected"
    entity_category: diagnostic
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: key1
    name: "Key1"
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: key2
    name: "Key2"
    on_press:
      - lambda: |-
          id(page_auto) = false;
          id(page_index) = (id(page_index) + 1) % 2;
      - component.update: epaper_display
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: key3
    name: "Key3"
    on_press:
      - light.turn_on:
          id: buzzer
          brightness: 50%
      - delay: 100ms
      - light.turn_off: buzzer
      - component.update: epaper_display

interval:
  - interval: 1h
    then:
      - script.execute: fetch_forecast
  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return !id(fc_valid);'
          then:
            - script.execute: fetch_forecast

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Shanghai
    on_time_sync:
      # 网络时间同步后写入硬件 RTC，并重新解析明细
      then:
        - pcf8563.write_time:
        - script.execute: parse_records
    on_time:
      # 每个整点触发（1~6 点不刷新）
      - seconds: 0
        minutes: 0
        then:
          - if:
              condition:
                lambda: |-
                  auto now = id(sntp_time).now();
                  return !(now.hour >= 1 && now.hour < 6);
              then:
                - component.update: epaper_display
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    update_interval: never

# ---------------------------------------------------------------------
# 字体（本地 fonts/ 目录，无需联网下载）
# 数字用 Black，标题/强调用 Bold，辅助信息用 Regular
# 注意: glyphs 是"白名单"，只包含界面用到的字符；新增固定文案时记得补字。
# font_glyphs_cjk.yaml 为全量 CJK 字表（已按 NotoSansSC 实际覆盖过滤），供动态内容(消费地点)使用。
